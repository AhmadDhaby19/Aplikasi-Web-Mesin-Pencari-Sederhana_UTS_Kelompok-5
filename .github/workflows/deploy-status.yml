name: Register Vercel Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  deployments: write
  contents: read

jobs:
  deploy-status:
    runs-on: ubuntu-latest
    steps:
      - name: Create Production Deployment Entry
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'Production',
              description: 'Production deployment on Vercel',
              auto_merge: false,
              required_contexts: []
            });

            if (deployment.data && deployment.data.id) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                state: 'success',
                environment_url: 'https://aplikasi-web-mesin-pencari-sederhan.vercel.app',
                log_url: 'https://aplikasi-web-mesin-pencari-sederhan.vercel.app',
                description: 'Aplikasi aktif di Vercel'
              });
            }
